version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - noctx
    - misspell
    - revive
    - gosec
    - errorlint
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, bodyclose, noctx]
      - path: internal/repository/postgres/dbgen/
        linters: [revive, gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
